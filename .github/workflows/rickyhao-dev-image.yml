name: Rickyhao Dev Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - rickyhao/dev

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository == 'Ricky-Hao/LibreChat' && github.ref == 'refs/heads/rickyhao/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          printf 'image=ghcr.io/%s\n' "${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          printf 'date=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.multi
          target: api-build
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:rickyhao-dev
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=rickyhao-dev-amd64
          cache-to: type=gha,mode=max,scope=rickyhao-dev-amd64
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
